name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ime-build.yml
  draft:
    needs: validate
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: windows-validation
          path: release
      - name: Require completed redistribution and clean-host checks
        run: node scripts/verify-ime-package.mjs --app release/win-unpacked
      - name: Archive application sources at the built revision
        run: git archive --format=zip --output=release/VrcLiveIme-sources.zip HEAD
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-validation
          draft: true
          files: |
            release/*.exe
            release/*.zip
          generate_release_notes: true
